<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Web of Life</title>
<style>
:root{--ink:#2d2a1f;--forest:#2f6b3a;--line:#b9a77c}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:190px 1fr 410px;grid-template-rows:auto 1fr auto;color:var(--ink);font:16px/1.5 Calibri,'Segoe UI',sans-serif;overflow:hidden;
background:#f3ead6 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .4 0 0 0 0 .3 0 0 0 0 .2 0 0 0 .1 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
header{grid-column:1/4;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px;padding:10px 22px;border-bottom:1px solid var(--line)}
h1{font:600 clamp(20px,3vw,34px)/1.1 Cambria,Georgia,serif;letter-spacing:.14em;margin:0}
header p{margin:0;font:italic 15px Cambria,Georgia,serif;flex:1}
nav button,#left button,.chips button,.q button,.x,.btn{font:inherit;cursor:pointer;color:var(--ink)}
nav button{background:none;border:0;padding:2px 10px;border-bottom:1px solid transparent}nav button:hover{border-color:var(--forest)}
#left{padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);overflow:auto}
#left button{background:none;border:0;font:italic 19px Cambria,Georgia,serif;text-align:left;padding:7px 10px;border-left:3px solid var(--line)}
#left button:hover,#left button.on{border-color:var(--forest);background:rgba(47,107,58,.1)}
#view{position:relative;min-height:0;background:#bfe3f2}#c,#ov{width:100%;height:100%;display:block;touch-action:none}#c{cursor:grab}#ov{display:none;position:absolute;inset:0;background:#f6efdc}
#tag{position:absolute;pointer-events:none;background:#2d2a1f;color:#fbf3dc;padding:1px 9px;font-size:14px;display:none;transform:translate(12px,-30px)}
#panel{padding:16px 20px;overflow:auto;border-left:1px solid var(--line);background:rgba(251,244,225,.9)}
#panel h2{font:600 28px Cambria,Georgia,serif;margin:4px 0}#panel h3{font:600 19px Cambria,Georgia,serif;margin:12px 0 4px}#panel p{margin:.4em 0}.def{font-family:Cambria,Georgia,serif;font-size:17px}
#panel ul{padding-left:20px;margin:.4em 0}.key{border-left:4px solid var(--forest);padding:6px 12px;margin:10px 0;font:italic 16px Cambria,Georgia,serif;background:rgba(143,207,106,.2)}
.badge{display:inline-block;padding:1px 10px;color:#fff;font-size:13px;font-weight:600;margin-right:6px}
.chips,.q{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chips button,.q button,.btn,.x{font-size:14px;padding:4px 10px;border:1px solid var(--forest);background:#fffdf5}
.chips button:hover,.q button:hover,.btn:hover{background:var(--forest);color:#fff}.x{float:right}
.zone{min-height:62px;border:2px dashed;padding:4px 8px;margin:6px 0;background:rgba(255,255,255,.5)}.zone b{display:block}
input[type=range]{width:100%}label.s{display:block;font-weight:600;margin:6px 0}
.bar{height:14px;background:#e5dcc0;margin:2px 0 8px}.bar i{display:block;height:100%;transition:width .3s}
#gr{width:100%;border:1px solid var(--line);background:#fffaf0}
footer{grid-column:1/4;display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:7px 22px;border-top:1px solid var(--line);font-size:14px}
footer i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}footer .btn{margin-left:auto}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto auto 55vh auto auto;overflow:auto}header,footer{grid-column:1}#left{flex-direction:row;flex-wrap:wrap;border:0}#left button{font-size:16px}}
</style></head><body>
